# gc3d.cloud on the shared Nginx (the "web" container of /opt/vivid/infra). Installed by gc3d-setup.sh as
# /opt/vivid/infra/nginx/extra/gc3d.conf and mounted read-only at /etc/nginx/conf.d/gc3d.conf, next to the default.conf
# the image renders from the main template. It reuses what the main template defines at http level: the rate-limit zones
# (api, auth, pages, perip), the $is_probe map and the "vivid" log format.
#
# Safety for the live site:
#   - The gc3d app is reached through Docker's DNS at request time (resolver + variable), never at startup, so Nginx
#     starts and vividenginesolutions.com works even when the gc3d app is stopped or missing (gc3d.cloud then gets 502).
#   - gc3d-setup.sh tests the full configuration in a throwaway container (nginx -t) before the live one is restarted,
#     and puts the old configuration back if vividenginesolutions.com isn't healthy afterwards.
#   - gc3d.cloud is a staging site: X-Robots-Tag noindex on every response.

# Plain HTTP: certificate challenges, everything else to HTTPS.
server {
  listen 80;
  listen [::]:80;
  server_name gc3d.cloud www.gc3d.cloud;
  access_log /var/log/nginx/gc3d-access.log vivid;
  location /.well-known/acme-challenge/ { root /var/www/acme; }
  location / { return 301 https://gc3d.cloud$request_uri; }
}

# www -> apex
server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name www.gc3d.cloud;
  ssl_certificate     /etc/letsencrypt/live/gc3d.cloud/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/gc3d.cloud/privkey.pem;
  access_log /var/log/nginx/gc3d-access.log vivid;
  return 301 https://gc3d.cloud$request_uri;
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name gc3d.cloud;

  ssl_certificate     /etc/letsencrypt/live/gc3d.cloud/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/gc3d.cloud/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;

  # Own logs, so gc3d errors are counted separately from the live site (infra/gc3d/error-watch.sh).
  access_log /var/log/nginx/gc3d-access.log vivid;
  error_log /var/log/nginx/gc3d-error.log warn;

  # Docker's embedded DNS; re-resolved every 10 s, so a recreated gc3d container (new IP) is found right away.
  resolver 127.0.0.11 valid=10s ipv6=off;
  resolver_timeout 3s;
  set $gc3d_app http://gc3d-app:8080;

  add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(self), geolocation=()" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Robots-Tag "noindex, nofollow" always;
  add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'unsafe-inline' https://web.squarecdn.com https://sandbox.web.squarecdn.com https://js.squareup.com https://accounts.google.com https://apis.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://web.squarecdn.com https://sandbox.web.squarecdn.com; font-src 'self' data: https://fonts.gstatic.com https://square-fonts-production-f.squarecdn.com; img-src 'self' data: blob: https:; media-src 'self' blob: https:; connect-src 'self' https://*.squareup.com https://*.squareupsandbox.com https://*.squarecdn.com https://accounts.google.com; frame-src https://*.squarecdn.com https://*.squareup.com https://*.squareupsandbox.com https://accounts.google.com; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'self'; form-action 'self'" always;
  proxy_hide_header X-Content-Type-Options;
  proxy_hide_header X-Frame-Options;
  proxy_hide_header X-Robots-Tag;

  client_max_body_size 25m;
  client_body_timeout 15s;
  client_header_timeout 15s;
  send_timeout 30s;
  keepalive_timeout 65s;
  limit_conn perip 20;

  location ~ /\.(?!well-known/) { return 444; }
  if ($is_probe) { return 444; }

  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-Proto https;
  # Variable upstream: a short connect timeout keeps a stopped gc3d app from tying up workers.
  proxy_connect_timeout 5s;

  # The bare domain opens the 3D Design Studio.
  location = / { return 302 /studio; }

  location = /api/events {
    limit_req zone=api burst=20 nodelay;
    proxy_pass $gc3d_app;
    proxy_set_header Connection '';
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
  }

  # Takeoff progress streams (server-sent events).
  location ~ ^/api/projects/[^/]+/takeoffs/[^/]+/events$ {
    limit_req zone=api burst=20 nodelay;
    proxy_pass $gc3d_app;
    proxy_set_header Connection '';
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 15m;
  }

  location = /api/ai-search/ask {
    limit_req zone=api burst=10 nodelay;
    proxy_pass $gc3d_app;
    proxy_set_header Connection '';
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 300s;
  }

  location /api/auth/ {
    limit_req zone=auth burst=10 nodelay;
    proxy_pass $gc3d_app;
  }

  location /api/ {
    limit_req zone=api burst=40 nodelay;
    proxy_pass $gc3d_app;
    proxy_read_timeout 180s;
  }

  location /assets/ {
    proxy_pass $gc3d_app;
    proxy_hide_header Cache-Control;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header X-Robots-Tag;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
  }

  location / {
    limit_req zone=pages burst=60 nodelay;
    proxy_pass $gc3d_app;
  }
}
