# Matches Nginx access-log lines answered 429 (rate or connection limit hit).
# Log format "vivid" in infra/nginx/templates/default.conf.template:
#   1.2.3.4 - - [22/Oct/2026:19:40:01 +0000] "GET /api/x HTTP/2.0" 429 162 "-" "UA"
[Definition]
failregex = ^<HOST> - \S+ \[[^\]]+\] "[^"]*" 429 \d+ "[^"]*" "[^"]*"\s*$
ignoreregex =
