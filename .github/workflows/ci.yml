# Runs on every pull request and on pushes to main and release branches.
# Same checks as scripts/verify-release.sh; the PR can't be merged with a red check once branch protection requires it.
name: CI
on:
  pull_request:
  push:
    branches: [main, 'release/**']
permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: gitleaks
        env:
          GITLEAKS_VERSION: 8.21.2
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar -xz gitleaks
          ./gitleaks git --redact --no-banner --config .gitleaks.toml --report-format json --report-path gitleaks.json 2>&1 | tee gitleaks.log; rc=${PIPESTATUS[0]}
          # Findings are redacted (file, line and rule only); repeat them as annotations so they show on the pull request.
          if [ -s gitleaks.json ]; then jq -r '.[] | "\(.RuleID) \(.File):\(.StartLine) commit \(.Commit[0:7])"' gitleaks.json | head -30 | while read -r l; do echo "::error::gitleaks $l"; done; fi
          sed -r 's/\x1b\[[0-9;]*m//g' gitleaks.log | grep -E "RuleID|File|Line|Commit|leaks found|WRN|ERR|error" | head -40 | while read -r l; do echo "::error::gitleaks $l"; done
          exit $rc

  site:
    name: Website (lint, names, build)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: site } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: site/package-lock.json }
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run check:names
      - run: npm run build
      - name: Every indexable page was prerendered
        run: test -f dist/index.prerendered.html && test -f dist/areas/katy/index.html && grep -qi "<h1" dist/areas/katy/index.html

  backend:
    name: API (build, tests)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    services:
      postgres:
        image: postgres:16-bookworm
        env: { POSTGRES_PASSWORD: ci, POSTGRES_DB: vivid_test }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # A throwaway CI database only; the tests drop and recreate its schema.
      TEST_DATABASE_URL: postgres://postgres:ci@127.0.0.1:5432/vivid_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: backend/package-lock.json }
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - name: npm test
        run: |
          npm test 2>&1 | tee test.log; rc=${PIPESTATUS[0]}
          grep -E "^\s*not ok|^# (pass|fail)|Error:|error:" test.log | head -25 | cut -c1-300 | while read -r l; do echo "::error::$l"; done
          exit $rc

  release-check:
    name: Docker image, smoke test and repo checks (scripts/verify-release.sh)
    runs-on: ubuntu-latest
    needs: [site, backend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Full release check
        run: bash scripts/verify-release.sh
