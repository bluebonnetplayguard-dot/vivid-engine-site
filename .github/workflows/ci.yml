# Runs on every pull request and on pushes to main and release branches.
# Same checks as scripts/verify-release.sh; the PR can't be merged with a red check once branch protection requires it.
name: CI
on:
  pull_request:
  push:
    branches: [main, 'release/**']
permissions:
  contents: read

jobs:
  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: gitleaks
        env:
          GITLEAKS_VERSION: 8.21.2
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar -xz gitleaks
          ./gitleaks git --redact --no-banner --config .gitleaks.toml --log-opts="${{ github.event_name == 'pull_request' && format('{0}..{1}', github.event.pull_request.base.sha, github.sha) || '-50' }}"

  site:
    name: Website (lint, names, build)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: site } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: site/package-lock.json }
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run check:names
      - run: npm run build
      - name: Every indexable page was prerendered
        run: test -f dist/index.prerendered.html && test -f dist/areas/katy/index.html && grep -qi "<h1" dist/areas/katy/index.html

  backend:
    name: API (build, tests)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    services:
      postgres:
        image:
    name: Docker image, smoke test and repo checks
    runs-on: ubuntu-latest
    needs: [site, backend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Full release check (scripts/verify-release.sh)
        run: bash scripts/verify-release.sh
