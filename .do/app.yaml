# DigitalOcean App Platform spec. Create the app with:
#   doctl apps create --spec .do/app.yaml
# The static site serves the prerendered pages; requests to /api go to the NestJS service.
name: vivid-engine-site
region: nyc
static_sites:
  - name: web
    github:
      repo: bluebonnetplayguard-dot/vivid-engine-site
      branch: main
      deploy_on_push: true
    source_dir: /
    environment_slug: node-js
    build_command: npm ci && npm run build -w apps/web
    output_dir: apps/web/dist/client
    error_document: 404.html
    envs:
      - key: VITE_SITE_URL
        scope: BUILD_TIME
        value: https://www.vividenginesolutions.com
    routes:
      - path: /
services:
  - name: api
    github:
      repo: bluebonnetplayguard-dot/vivid-engine-site
      branch: main
      deploy_on_push: true
    source_dir: /
    environment_slug: node-js
    build_command: npm ci && npm run build -w apps/api
    run_command: npm start -w apps/api
    http_port: 3000
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-0.5gb
    health_check:
      http_path: /api/health
    routes:
      - path: /api
        preserve_path_prefix: true
    envs:
      - key: CONTACT_TO
        scope: RUN_TIME
        value: ""
      - key: CONTACT_FROM
        scope: RUN_TIME
        value: ""
      - key: SMTP_HOST
        scope: RUN_TIME
        value: ""
      - key: SMTP_PORT
        scope: RUN_TIME
        value: "587"
      - key: SMTP_USER
        scope: RUN_TIME
        value: ""
      - key: SMTP_PASS
        scope: RUN_TIME
        type: SECRET
        value: ""
